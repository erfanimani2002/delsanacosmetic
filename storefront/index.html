<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="Set a new password for your Pool Invest account.">

    <link rel="icon" href="../assets/icons/icon.svg" type="image/svg+xml">
    <link href="https://fonts.cdnfonts.com/css/uni-neue" rel="stylesheet">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/storefront/styles.css">

    <title>Delsana</title>

</head>
<body>
<header>

    <div class="header-left">
        <img src="../assets/logos/logo.PNG" alt="Delsana-logo">
    </div>

    <div class="header-right">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-text-align-justify preview-icon"><path d="M3 5h18"/><path d="M3 12h18"/><path d="M3 19h18"/></svg>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user preview-icon"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-heart preview-icon"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/></svg>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search preview-icon"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
    </div>

</header>
<main>

    <section class="hero">

        <div class="hero-img">
            <img src="../assets/images/homepage/hero1.PNG" alt="Delsana hero">
        </div>

        <div class="hero-cta">

            <div class="hero-text">

                <h1>دلسانا</h1>
                <span>لوازم آرایشی، بهداشتی و برقی</span>
                <p>پوستی زیبا، سالم و جوان</p>

            </div>

            <button type="submit" class="hero-actions">
                <span>شروع خرید</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-move-right preview-icon"><path d="M18 8L22 12L18 16"/><path d="M2 12H22"/></svg>

            </button>

        </div>

    </section>

    <a src="#"   class="links">

        <div class="banner-btn">

            <img src="../assets/images/banners/banner1.png" alt="">

            <div class="banner-details">
                <div class="logo">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-map-pin preview-icon"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
                </div>

                <div class="banner-text">

                    <h2>موقعیت مکانی</h2>
                    <span>
                        <p>فروشگاه ما را پیدا کنید</p>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-move-left preview-icon"><path d="M6 8L2 12L6 16"/><path d="M2 12H22"/></svg>
                    </span>

                </div>
            </div>
        </div>

    </a>
    <a src="#"   class="links">

        <div class="banner-btn">

            <img src="../assets/images/banners/banner1.png" alt="">

            <div class="banner-details">
                <div class="logo">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-brand-instagram"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M4 8a4 4 0 0 1 4 -4h8a4 4 0 0 1 4 4v8a4 4 0 0 1 -4 4h-8a4 4 0 0 1 -4 -4l0 -8" /><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /><path d="M16.5 7.5v.01" /></svg>
                </div>

                <div class="banner-text">

                    <h2>اینستاگرام</h2>
                    <span>
                        <p>ما را در اینستاگرام دنبال کنید</p>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-move-left preview-icon"><path d="M6 8L2 12L6 16"/><path d="M2 12H22"/></svg>
                    </span>

                </div>
            </div>
        </div>

    </a>

    <section class="categories">

        <h2 class="title">دسته بندی ها</h2>

        <div class="categories-grid">

            <a class="category-card">
                <img src="../assets/images/categories/skincare.png" alt="">
                <h3>مراقبت پوستی</h3>
            </a>

            <a class="category-card">
                <img src="../assets/images/categories/makeup.png" alt="">
                <h3>آرایشی</h3>
            </a>

            <a class="category-card">
                <img src="../assets/images/categories/haircare.png" alt="">
                <h3>مراقبت مو</h3>
            </a>

            <a class="category-card">
                <img src="../assets/images/categories/fragrance.png" alt="">
                <h3>عطر</h3>
            </a>

            <a class="category-card">
                <img src="../assets/images/categories/tools.png" alt="">
                <h3>وسایل جانبی</h3>
            </a>


        </div>
    </section>
</main>
</body>
</html>
